# Render Blueprint — deploys the BACKEND only. Render's blueprint spec supports
# web/worker/cron/backgroundWorker/pyserver types only; static sites cannot be
# declared in render.yaml. Create the frontend manually (see Context.md §8).
# Secrets (sync: false) are prompted on first deploy and editable in the dashboard.

services:
  # Backend API + Socket.IO web service
  - type: web
    name: abu-shuttle-backend
    runtime: node
    rootDir: abu-shuttle-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TERMINUS_DWELL_METERS
        value: 60
      - key: TERMINUS_DWELL_FIXES
        value: 3
      - key: RETURN_DEPART_METERS
        value: 20